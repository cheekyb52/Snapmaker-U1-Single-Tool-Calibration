# Snapmaker U1 Single Tool Calibration
# Project version: 0.1.0 | Updated: 2026-10-12
# Project: https://github.com/cheekyb52/Snapmaker-U1-Single-Tool-Calibration
# Calibration-project modifications; GPL-3.0, see LICENSE and NOTICE.md.

# Snapmaker U1 offset workflow using the native preserve-reference capability.
# T0 always requires the stock four-tool calibration. Only T1/T2/T3 may save.
# Independent saves freeze the existing shared reference and change one tool.
# Before a calibration-writing session, verify backup_printers.py's backup,
# then acknowledge it with OFFSET_ARM_SAVE BACKUP=<timestamp>. Restart clears it.

[gcode_macro _SM_OFFSET_STATE]
variable_stage: 'idle'
variable_mode: 'validate'
variable_target: 1
variable_reference: 0
variable_order: []
variable_index: 0
variable_baseline: []
variable_measured: []
variable_backup: ''
variable_tolerance_x: 0.05
variable_tolerance_y: 0.05
variable_tolerance_z: 0.05
variable_run_tolerances: [0.05, 0.05, 0.05]
variable_max_adjust: 2.0
variable_report: 'Not checked'
variable_soft_tools: []
variable_cleaning_temp: 200
variable_run_cleaning_temps: [200, 200, 200, 200]
gcode:
    {action_respond_info("Offset stage: %s; result: %s" % (printer['gcode_macro _SM_OFFSET_STATE'].stage, printer['gcode_macro _SM_OFFSET_STATE'].report))}

[gcode_macro _SM_OFFSET_IDLE]
gcode:
    {% if printer.print_stats.state not in ['standby', 'complete', 'cancelled'] or printer.virtual_sdcard.is_active != false or printer.pause_resume.is_paused != false %}
        {action_raise_error('Printing, paused or unknown state: offset commands are read-only.')}
    {% endif %}

[gcode_macro OFFSET_ARM_SAVE]
description: Acknowledge the verified local backup for this calibration session
gcode:
    _SM_OFFSET_IDLE
    {% set s = printer['gcode_macro _SM_OFFSET_STATE'] %}
    {% if s.stage != 'idle' or params.BACKUP|default('') == '' %}
        {action_raise_error('Arming requires an idle offset session and BACKUP=<verified timestamp>.')}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=backup VALUE='"{params.BACKUP}"'

[gcode_macro CALIBRATE_TOOL_0]
description: Warn that T0 requires stock calibration of all four tools
gcode:
    # Return normally: a command error also triggers a touchscreen anomaly.
    {action_respond_info('WARNING: T0 is the reference. Run stock Multi-Toolhead Calibration for all 4 tools. Single T0 calibration is disabled.')}
    # Shared Mainsail/Fluidd macro-prompt protocol. OK only closes the dialog.
    RESPOND TYPE=command MSG="action:prompt_begin T0 requires full calibration"
    RESPOND TYPE=command MSG="action:prompt_text T0 is the reference tool. Run stock Multi-Toolhead Calibration for all 4 tools. Single T0 calibration is disabled."
    RESPOND TYPE=command MSG="action:prompt_footer_button OK|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro CALIBRATE_TOOL_1]
description: Clean and calibrate physical T1 against unchanged T0
gcode:
    _SM_OFFSET_BEGIN MODE=single TOOL=1 {rawparams}

[gcode_macro CALIBRATE_TOOL_2]
description: Clean and calibrate physical T2 against unchanged T0
gcode:
    _SM_OFFSET_BEGIN MODE=single TOOL=2 {rawparams}

[gcode_macro CALIBRATE_TOOL_3]
description: Clean and calibrate physical T3 against unchanged T0
gcode:
    _SM_OFFSET_BEGIN MODE=single TOOL=3 {rawparams}

[gcode_macro CLEAN_AND_VALIDATE_OFFSETS]
description: Clean four tools and validate their relative offsets without saving
gcode:
    _SM_OFFSET_BEGIN MODE=validate {rawparams}

[gcode_macro _SM_OFFSET_BEGIN]
gcode:
    _SM_OFFSET_IDLE
    {% set s = printer['gcode_macro _SM_OFFSET_STATE'] %}
    {% set mode = params.MODE|default('validate')|lower %}
    {% set target = params.TOOL|default(1)|int %}
    {% set reference = params.REFERENCE|default(0)|int %}
    {% set names = ['extruder', 'extruder1', 'extruder2', 'extruder3'] %}
    {% set tolerances = [params.TOL_X|default(s.tolerance_x)|float, params.TOL_Y|default(s.tolerance_y)|float, params.TOL_Z|default(s.tolerance_z)|float] %}
    {% set heat = params.HEAT_TEMP|default(s.cleaning_temp)|float %}
    {% set heat_temps = [params.T0_TEMP|default(heat)|float, params.T1_TEMP|default(heat)|float, params.T2_TEMP|default(heat)|float, params.T3_TEMP|default(heat)|float] %}
    {% if mode not in ['single', 'validate'] %}
        {action_raise_error('MODE must be single or validate.')}
    {% endif %}
    {% if mode == 'single' and target == 0 %}
        {action_raise_error('WARNING: T0 is the reference. Run stock Multi-Toolhead Calibration for all 4 tools; single T0 calibration is disabled.')}
    {% endif %}
    {% if s.stage != 'idle' or printer.extruder_offset_calibration.calibration_step != 'idle' %}
        {action_raise_error('An offset or stock calibration session is already active.')}
    {% endif %}
    {% if mode == 'single' and (target not in [1, 2, 3] or reference not in [0, 1, 2, 3] or reference == target or s.backup == '') %}
        {action_raise_error('Single calibration needs T1/T2/T3, an unchanged reference, and a verified backup arm.')}
    {% endif %}
    {% if mode == 'single' %}
    {% if 'extruder_config_bak' not in printer or printer.extruder_config_bak.preserve_reference_supported|default(false) != true %}
        {action_raise_error('Independent saves require the native preserve-reference patch. Saving is blocked.')}
    {% endif %}
    {% endif %}
    {% for t in tolerances %}
        {% if not (t > 0 and t < 10) %}
            {action_raise_error('Tolerances must be finite positive values below 10 mm.')}
        {% endif %}
    {% endfor %}
    {% for t in heat_temps %}
        {% if not (t >= 170 and t < 300) %}
            {action_raise_error('Cleaning temperatures must be finite values from 170 to below 300 C.')}
        {% endif %}
    {% endfor %}
    {% set baseline = [printer.extruder.extruder_offset, printer.extruder1.extruder_offset, printer.extruder2.extruder_offset, printer.extruder3.extruder_offset] %}
    {% for offset in baseline %}
        {% if offset|length != 3 %}
            {action_raise_error('All four tools need valid saved offsets.')}
        {% endif %}
        {% for value in offset %}
            {% if not (value > -100 and value < 100) %}
                {action_raise_error('Invalid saved offset; calibration is blocked.')}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {% set order = [reference, target] if mode == 'single' else [0, 1, 2, 3] %}
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=stage VALUE='"starting"'
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=mode VALUE='"{mode}"'
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=target VALUE={target}
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=reference VALUE={reference}
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=order VALUE='{order}'
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=index VALUE=0
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=baseline VALUE='{baseline}'
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=measured VALUE='[]'
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=run_tolerances VALUE='{tolerances}'
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=run_cleaning_temps VALUE='{heat_temps}'
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=report VALUE='"In progress"'
    # Use stock G-code components without starting its touchscreen state machine.
    SET_LED LED=cavity_led WHITE=1
    _EXTRUDER_OFFSET_ACTION_PREHEAT
    G28
    _EXTRUDER_OFFSET_ACTION_PREHOMING
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=stage VALUE='"clean"'
    _SM_OFFSET_CLEAN

[gcode_macro _SM_OFFSET_CLEAN]
gcode:
    _SM_OFFSET_IDLE
    {% set s = printer['gcode_macro _SM_OFFSET_STATE'] %}
    {% if s.stage != 'clean' %}
        {action_raise_error('No tool is awaiting automatic cleaning.')}
    {% endif %}
    {% set tool = s.order[s.index] %}
    {% set names = ['extruder', 'extruder1', 'extruder2', 'extruder3'] %}
    {% set kind = printer.print_task_config.filament_type[tool]|string|upper %}
    {% set soft = 1 if tool in s.soft_tools or 'TPU' in kind or 'TPE' in kind else 0 %}
    _EXTRUDER_OFFSET_ACTION_HEAT_T{tool} HEAT_TEMP={s.run_cleaning_temps[tool]}
    _EXTRUDER_OFFSET_ACTION_AUTO_CLEAN_T{tool} SOFT={soft} NOZZLE_DIAMETER={printer[names[tool]].nozzle_diameter}
    _EXTRUDER_OFFSET_ACTION_MANUAL_CLEAN_T{tool}
    M400
    _SM_OFFSET_MANUAL_READY

[gcode_macro _SM_OFFSET_MANUAL_READY]
gcode:
    _SM_OFFSET_IDLE
    {% set s = printer['gcode_macro _SM_OFFSET_STATE'] %}
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=stage VALUE='"manual"'
    {action_respond_info('Clean the hot T%d nozzle, then press OFFSET_CONTINUE.' % s.order[s.index])}

[gcode_macro OFFSET_CONTINUE]
description: Confirm manual cleaning or PEI plate removal and continue the cycle
gcode:
    _SM_OFFSET_IDLE
    {% set s = printer['gcode_macro _SM_OFFSET_STATE'] %}
    {% if s.stage == 'manual' %}
        SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=stage VALUE='"cooling"'
        _EXTRUDER_OFFSET_ACTION_WAIT_COOL_T{s.order[s.index]} TEMP=130
        _SM_OFFSET_NEXT
    {% elif s.stage == 'plate' %}
        SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=stage VALUE='"probing"'
        M190 S55
        DETECT_BED_PLATE PRESENCE=0
        {% for tool in s.order %}
            _SM_OFFSET_MEASURE TOOL={tool} POINTS={10 if s.mode == 'single' else 6}
        {% endfor %}
        _SM_OFFSET_FINISH
    {% else %}
        {action_raise_error('Continue is only available after manual cleaning or plate removal.')}
    {% endif %}

[gcode_macro _SM_OFFSET_NEXT]
gcode:
    _SM_OFFSET_IDLE
    {% set s = printer['gcode_macro _SM_OFFSET_STATE'] %}
    {% if s.stage != 'cooling' %}
        {action_raise_error('Unexpected cleaning stage.')}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=index VALUE={s.index + 1}
    {% if s.index + 1 < s.order|length %}
        SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=stage VALUE='"clean"'
        _SM_OFFSET_CLEAN
    {% else %}
        SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=stage VALUE='"plate"'
        {action_respond_info('Remove the PEI plate and clear the calibration ring, then press OFFSET_CONTINUE.')}
    {% endif %}

[gcode_macro _SM_OFFSET_MEASURE]
gcode:
    _SM_OFFSET_IDLE
    {% set s = printer['gcode_macro _SM_OFFSET_STATE'] %}
    {% set tool = params.TOOL|int %}
    {% if s.stage != 'probing' or s.measured|length >= s.order|length or tool != s.order[s.measured|length] %}
        {action_raise_error('Unexpected measurement order; saving is blocked.')}
    {% endif %}
    T{tool} A0
    M109 T{tool} A0 S130
    # Raw probe command: publish transient results, with no log or auto-save.
    PROBE_XYZ_OFFSET_CALIBRATE Z_PROBE_Y_MOVE_OFFSET=-1 SAMPLE_RETRACT_DIST=1 SAMPLES_AXIS=1 SAMPLE_DIR=1 PROBE_FAST_SPEED=2 PROBE_SPEED=2 SAMPLE_DIST=20 SAMPLES_TOLERANCE=0.02 SAMPLES_TOLERANCE_RETRIES=10 SAMPLES=3 HORIZONTAL_MOVE_X=13 HORIZONTAL_MOVE_Y=234.5 HORIZONTAL_MOVE_Z=2 RETRACT_Z_HIGHT=0.7 SAMPLE_TRIG_FREQ=450 PROBE_XYZ_MODE=1 HORIZONTAL_DIST=5 PROBE_POINTS={params.POINTS|int} WAIT_BEFORE_SETUP=0.1 WAIT_AFTER_SETUP=0.05 UPDATE_CONFIG=1 SAVE_INFO=0
    _SM_OFFSET_CAPTURE TOOL={tool}

[gcode_macro _SM_OFFSET_CAPTURE]
gcode:
    _SM_OFFSET_IDLE
    {% set s = printer['gcode_macro _SM_OFFSET_STATE'] %}
    {% set names = ['extruder', 'extruder1', 'extruder2', 'extruder3'] %}
    {% set result = printer.extruder_offset_calibration[names[params.TOOL|int] + '_last_xyz_result'] %}
    {% if result is none or result|length != 3 %}
        {action_raise_error('Incomplete ring probe; saving is blocked. Use OFFSET_ABORT.')}
    {% endif %}
    {% for value in result %}
        {% if not (value > -1000 and value < 1000) %}
            {action_raise_error('Invalid ring probe result; saving is blocked.')}
        {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=measured VALUE='{s.measured + [result]}'

[gcode_macro _SM_OFFSET_FINISH]
gcode:
    _SM_OFFSET_IDLE
    {% set s = printer['gcode_macro _SM_OFFSET_STATE'] %}
    {% set names = ['extruder', 'extruder1', 'extruder2', 'extruder3'] %}
    {% if s.stage != 'probing' or s.measured|length != s.order|length %}
        {action_raise_error('Missing measurements; saving is blocked.')}
    {% endif %}
    {% if s.mode == 'single' %}
        {% set d = [s.measured[1][0]-s.measured[0][0]-(s.baseline[s.target][0]-s.baseline[s.reference][0]), s.measured[1][1]-s.measured[0][1]-(s.baseline[s.target][1]-s.baseline[s.reference][1]), s.measured[1][2]-s.measured[0][2]-(s.baseline[s.target][2]-s.baseline[s.reference][2])] %}
    {% if 'extruder_config_bak' not in printer or printer.extruder_config_bak.preserve_reference_supported|default(false) != true %}
        {action_raise_error('Independent saves require the native preserve-reference patch. Saving is blocked.')}
    {% endif %}
        {% for i in range(4) %}
            {% if printer[names[i]].extruder_offset != s.baseline[i] %}
                {action_raise_error('Saved offsets changed during the session; saving is blocked.')}
            {% endif %}
        {% endfor %}
        {% for value in d %}
            {% if not (value|abs <= s.max_adjust) %}
                {action_raise_error('Correction exceeds max_adjust; inspect hardware. Use OFFSET_ABORT.')}
            {% endif %}
        {% endfor %}
        {% if s.target not in [1, 2, 3] or s.backup == '' %}
            {action_raise_error('Single save is not authorized for this tool/session.')}
        {% endif %}
        SET_EXTRUDER_BASE_POSITION EXTRUDER={names[s.target]} X_ADJUST={d[0]} Y_ADJUST={d[1]} Z_ADJUST={d[2]} PRESERVE_REFERENCE=1
        _SM_OFFSET_VERIFY_SAVE DX={d[0]} DY={d[1]} DZ={d[2]}
        _SM_OFFSET_SYNC_ACTIVE
        SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=report VALUE='"T{s.target} saved. Other tools preserved"'
    {% else %}
        {% set check = namespace(failed=false) %}
        {% for i in range(4) %}
            {% for j in range(i) %}
                {% set d = [s.measured[i][0]-s.measured[j][0]-(s.baseline[i][0]-s.baseline[j][0]), s.measured[i][1]-s.measured[j][1]-(s.baseline[i][1]-s.baseline[j][1]), s.measured[i][2]-s.measured[j][2]-(s.baseline[i][2]-s.baseline[j][2])] %}
                {% set fail = d[0]|abs > s.run_tolerances[0] or d[1]|abs > s.run_tolerances[1] or d[2]|abs > s.run_tolerances[2] %}
                {% if fail %}{% set check.failed = true %}{% endif %}
                {action_respond_info('T%d/T%d residual XYZ=%s: %s' % (i, j, d, 'FAIL: inspect/calibrate these tools' if fail else 'PASS'))}
            {% endfor %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=report VALUE='"{'FAIL: perform calibration. See pair results' if check.failed else 'PASS: all tool pairs within tolerance'}"'
    {% endif %}
    _EXTRUDER_OFFSET_ACTION_EXIT
    SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=stage VALUE='"idle"'

[gcode_macro _SM_OFFSET_VERIFY_SAVE]
gcode:
    _SM_OFFSET_IDLE
    {% set s = printer['gcode_macro _SM_OFFSET_STATE'] %}
    {% set names = ['extruder', 'extruder1', 'extruder2', 'extruder3'] %}
    {% set d = [params.DX|float, params.DY|float, params.DZ|float] %}
    {% if s.stage != 'probing' or s.mode != 'single' or s.target not in [1, 2, 3] %}
        {action_raise_error('Unexpected save verification stage. Use OFFSET_ABORT.')}
    {% endif %}
    {% if 'extruder_config_bak' not in printer or printer.extruder_config_bak.preserve_reference_supported|default(false) != true %}
        {action_raise_error('Independent saves require the native preserve-reference patch. Saving is blocked.')}
    {% endif %}
    {% if printer.extruder_config_bak.offset_reference is none %}
        {action_raise_error('Shared reference was not preserved. Use OFFSET_ABORT.')}
    {% endif %}
    {% for i in range(4) %}
        {% for axis in range(3) %}
            {% set expected = s.baseline[i][axis] + (d[axis] if i == s.target else 0) %}
            {% if (printer[names[i]].extruder_offset[axis] - expected)|abs > 0.00000001 %}
                {action_raise_error('Runtime offsets do not match the independent save. Use OFFSET_ABORT.')}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {action_respond_info('T%d saved with correction XYZ=%s. Runtime offsets verified for all four tools.' % (s.target, d))}

[gcode_macro _SM_OFFSET_SYNC_ACTIVE]
gcode:
    _SM_OFFSET_IDLE
    {% set active = printer.toolhead.extruder %}
    {% if active not in ['extruder', 'extruder1', 'extruder2', 'extruder3'] %}
        {action_raise_error('Unknown active tool. Runtime offset synchronization is blocked.')}
    {% endif %}
    {% set offset = printer[active].extruder_offset %}
    {% if offset|length != 3 %}
        {action_raise_error('Invalid active tool offset. Runtime synchronization is blocked.')}
    {% endif %}
    {% for value in offset %}
        {% if not (value > -100 and value < 100) %}
            {action_raise_error('Invalid active tool offset. Runtime synchronization is blocked.')}
        {% endif %}
    {% endfor %}
    SET_GCODE_OFFSET X={offset[0]} Y={offset[1]} Z={offset[2]} MOVE=0

[gcode_macro OFFSET_ABORT]
description: Exit an idle calibration session and turn off heaters
gcode:
    _SM_OFFSET_IDLE
    {% set s = printer['gcode_macro _SM_OFFSET_STATE'] %}
    {% if s.stage != 'idle' %}
        _EXTRUDER_OFFSET_ACTION_EXIT
        SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=stage VALUE='"idle"'
        SET_GCODE_VARIABLE MACRO=_SM_OFFSET_STATE VARIABLE=report VALUE='"Aborted. No additional save"'
    {% endif %}
